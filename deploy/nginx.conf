server {
    listen 80;
    server_name js.zvinci.cn;
    client_max_body_size 20m;

    # ACME http-01 与 http→https 跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name js.zvinci.cn;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/js.zvinci.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/js.zvinci.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 大文件传输优化(白屏根因: 2.36MB未压缩JS在跨境链路反复断流, 页面一直等JS)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 静态资源长缓存(文件名带hash, 内容变即换名)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # admin 静态站
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # api 反代 (NestJS 自带 /api 全局前缀, 不剥前缀)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # API trust proxy 只认这一跳。必须把客户端地址传进去, 登录限流才看得到真实 IP。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
